[build]
  command = "npm run build:client"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API routes -> serverless functions.
# IMPORTANT: these must come before the SPA catch-all redirect below,
# Netlify applies redirects in order and uses the first match.
[[redirects]]
  from = "/api/ai/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Single-page app fallback so client-side routing doesn't 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions.environment]
  NODE_VERSION = "20"
